[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-parliament"
version = "0.1.0"
description = "RAG chat over the ParlaMint corpus (29 parliaments) with grounded, cited answers"
requires-python = ">=3.10"
dependencies = [
    # Corpus + index
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",          # parquet backend (parse / index / eval)
    "qdrant-client>=1.12",
    # Embedding + cross-encoder reranking (BGE-m3 family)
    "sentence-transformers>=3.0",
    # Generation
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # Serving: FastAPI backend + Streamlit frontend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "streamlit>=1.35",
]
# The GPU embedding step (scripts/scale/embed_corpus.py) also needs torch, which
# must be a CUDA build matching your driver, so it's installed separately, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# (The Streamlit frontend container uses the leaner requirements-web.txt.)

[project.optional-dependencies]
# Dev/eval extras: the offline eval tests (metrics + relevance judge) run under
# pytest with no Qdrant server and no API key — install with `pip install -e .[dev]`.
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["eval/tests"]
